---
name: GoFitness
version: "1.1.0"
slug: gofitness
description: >-
  Local-first, gamified weight-loss and meal-prep coach for the whole
  household. Female and male calorie targets, breastfeeding-safe plans,
  real recipes with shopping lists, and AI photo calorie estimation.
url: https://github.com/marvin-w/gofitness-homeassistant/tree/main/gofitness
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:dumbbell
panel_title: GoFitness
# Show the sidebar panel to every Home Assistant user, not just admins, so the
# whole household can open the app. Each user still gets their own profile via
# ingress auth. Non-admins cannot see the add-on's config/logs pages regardless.
panel_admin: false
hassio_api: true
homeassistant_api: true
options:
  anthropic_api_key: ""
  ai_model: claude-opus-5
  default_language: de
  publish_sensors: true
  log_level: info
schema:
  anthropic_api_key: password?
  ai_model: str?
  default_language: list(de|en)
  publish_sensors: bool
  log_level: list(debug|info|warn|error)
